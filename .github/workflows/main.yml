name: main
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      image: ${{ steps.paths.outputs.image }}
      site_deploy: ${{ steps.paths.outputs['site-deploy'] }}
      site_node_image: ${{ steps.paths.outputs.site_node_image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        run: |
          .github/ci/changes.sh >> "$GITHUB_OUTPUT"
          . .github/ci/versions.sh
          printf 'site_node_image=%s\n' "$SITE_NODE_IMAGE" >> "$GITHUB_OUTPUT"
  tag-prerelease:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - run: .github/ci/tag-prerelease.sh --self-test
      - id: tag
        run: .github/ci/tag-prerelease.sh
  publish-dev:
    needs: tag-prerelease
    if: github.event_name == 'push' && needs.tag-prerelease.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    environment: image-release
    concurrency: &publish-queue
      group: publish-image
      queue: max
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - env:
          DEV_TAG: ${{ needs.tag-prerelease.outputs.tag }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: .github/ci/publish-image.sh "$DEV_TAG"
  publish-main:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    environment: image-release
    concurrency: *publish-queue
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: .github/ci/publish-image.sh
  build-site:
    needs: changes
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.site_deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ${{ needs.changes.outputs.site_node_image }}
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.dist.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: |
          .github/ci/bun.sh
          .github/ci/site-node.sh site bun run build
      - id: dist
        run: |
          .github/ci/check-site-dist.sh site/dist
          printf 'name=site-dist-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.dist.outputs.name }}
          path: site/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
  deploy-site:
    needs: [changes, build-site]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ${{ needs.changes.outputs.site_node_image }}
    permissions:
      contents: read
    environment:
      name: production
      url: https://postkeep.dev
    concurrency:
      group: pages-postkeep-dev
      queue: max
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Prepare deployment
        env:
          ARTIFACT_NAME: ${{ needs.build-site.outputs.artifact_name }}
        run: |
          test -n "$ARTIFACT_NAME"
          .github/ci/bun.sh
          .github/ci/site-node.sh site/deploy
          title=$(git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format=%s)
          printf 'COMMIT_MESSAGE=%s\n' "$title" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ needs.build-site.outputs.artifact_name }}
          path: ${{ runner.temp }}/site-dist
          digest-mismatch: error
      - run: .github/ci/check-site-dist.sh "$RUNNER_TEMP/site-dist"
      - name: Deploy static site
        working-directory: site/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node_modules/.bin/wrangler pages deploy "$RUNNER_TEMP/site-dist" \
            --project-name="${CLOUDFLARE_PAGES_PROJECT:?CLOUDFLARE_PAGES_PROJECT is not set}" \
            --branch=main --commit-hash="$GITHUB_SHA" --commit-message="$COMMIT_MESSAGE"
