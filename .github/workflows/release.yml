name: release
on:
  push:
    tags: ['v*', '!v*-dev.[0-9]+']
permissions: {}
jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    environment: image-release
    concurrency:
      group: publish-image
      queue: max
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: .github/ci/publish-image.sh
