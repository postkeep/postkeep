[package]
name = "postkeep-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Kept out of the main workspace: it needs a nightly toolchain and
# libFuzzer, and must not affect the workspace lockfile.
[workspace]
members = ["."]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
postkeep-mail = { path = "../crates/mail", features = ["fuzzing"] }
postkeep-auth = { path = "../crates/auth", features = ["fuzzing"] }
postkeep = { path = "../crates/server", default-features = false, features = ["sqlite", "fuzzing"] }
postkeep-store = { path = "../crates/store", default-features = false, features = ["fuzzing"] }
libfuzzer-sys = "0.4"
postkeep-upstream = { path = "../crates/upstream", features = ["fuzzing"] }
postkeep-webhook = { path = "../crates/webhook" }
url = "2"

[profile.release]
debug = 1

[[bin]]
name = "utf7"
path = "fuzz_targets/utf7.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_message"
path = "fuzz_targets/parse_message.rs"
test = false
doc = false
bench = false

