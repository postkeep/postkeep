[package]
name = "postkeep-mail"
description = "Async IMAP and SMTP mail client with presets for iCloud Mail, Fastmail, Yahoo Mail and Gmail, used by postkeep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["imap", "smtp", "email", "icloud", "mcp"]
categories = ["email", "network-programming", "asynchronous"]

[lib]
name = "postkeep_mail"

[features]
# Internal entry points for the cargo-fuzz targets in `fuzz/`.
fuzzing = []

[dependencies]
async-channel.workspace = true
async-imap.workspace = true
chrono.workspace = true
futures.workspace = true
lettre.workspace = true
mail-parser.workspace = true
rustls.workspace = true
secrecy.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "time"] }
tokio-rustls.workspace = true
tracing.workspace = true
uuid.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
encoding_rs.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }

[lints]
workspace = true
