{#- The result of a Remove, at the top of the Filter rules block. #}
          {%- if let Some(notice) = webhook.filter_notice %}
          {%- if notice.success %}
            <p class="result result--ok" role="status"><svg class="i i--sm" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.2 2.4 2.4 4.6-4.8"/></svg><span>{{ notice.text }}</span></p>
          {%- else %}
            <p class="result result--bad" role="alert"><svg class="i i--sm" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V13"/><path d="M12 16.5h.01"/></svg><span>{{ notice.text }}</span></p>
          {%- endif %}
          {%- endif %}
